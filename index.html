<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PVME Tracker">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23d4af37' width='100' height='100' rx='20'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='%231a1a2e'>📸</text></svg>">
    <title>PVME Picture Day Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        
        input, select, button {
            font-family: inherit;
        }
        
        input[type="checkbox"] {
            width: 24px;
            height: 24px;
            accent-color: #eab308;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: #1e293b;
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #334155;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: #1e293b;
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
        }

        .modal-close {
            background: #334155;
            border: none;
            color: #e2e8f0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .product-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }

        .product-row:last-child {
            border-bottom: none;
        }

        .product-name {
            font-weight: 500;
        }

        .product-count {
            font-weight: bold;
            color: #eab308;
            font-size: 18px;
        }

        .fulfillment-section {
            margin-bottom: 24px;
        }

        .fulfillment-title {
            font-size: 14px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eab308;
        }

        .fulfillment-item {
            padding: 10px 0;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }

        .fulfillment-item:last-child {
            border-bottom: none;
        }

        .fulfillment-photo {
            color: #eab308;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // ============ FORM CONFIGURATIONS ============
        const FORMS = {
            'new_ait': {
                name: 'New AIT Form',
                formId: '253004946489061',
                packages: {
                    'A': { name: 'Package A', desc: '8×12 Class Group + 8×10 Individual', price: 25, needsPhoto: true, products: ['Class Group 8x12', 'Individual 8x10'] },
                    'B': { name: 'Package B', desc: '8×12 Class Group', price: 20, needsPhoto: false, products: ['Class Group 8x12'] },
                    'C': { name: 'Package C', desc: '8×10 Individual', price: 20, needsPhoto: true, products: ['Individual 8x10'] },
                    'D': { name: 'Package D', desc: '8×10 Buddy Shot', price: 20, needsPhoto: true, products: ['Buddy Shot 8x10'] },
                    'G1': { name: 'Package G1', desc: 'Mouse Pad', price: 15, needsPhoto: true, products: ['Mouse Pad'] },
                    'G2': { name: 'Package G2', desc: 'Phone Socket Grip', price: 15, needsPhoto: true, products: ['Phone Socket Grip'] },
                    'G3': { name: 'Package G3', desc: 'Dog Tag (Photo)', price: 15, needsPhoto: true, products: ['Dog Tag'] },
                    'G4': { name: 'Package G4', desc: 'Bag Tag (3) Double-Sided', price: 30, needsPhoto: true, products: ['Bag Tag', 'Bag Tag', 'Bag Tag'] },
                    'G5': { name: 'Package G5', desc: 'Bag Tag (1) Double-Sided', price: 12, needsPhoto: true, products: ['Bag Tag'] },
                    'G6': { name: 'Package G6', desc: '11oz Mug (Full Wrap)', price: 15, needsPhoto: true, products: ['Mug 11oz'] },
                    'G7': { name: 'Package G7', desc: '14oz Deluxe Travel Mug', price: 30, needsPhoto: true, products: ['Travel Mug 14oz'] }
                }
            },
            'old_ait': {
                name: 'Old AIT Form',
                formId: '252858215899071',
                packages: {
                    'A': { name: 'Package A', desc: '8×10 Class Group + 8×10 Individual', price: 25, needsPhoto: true, products: ['Class Group 8x10', 'Individual 8x10'] },
                    'B': { name: 'Package B', desc: '8×10 Class Group', price: 20, needsPhoto: false, products: ['Class Group 8x10'] },
                    'C': { name: 'Package C', desc: '8×10 Individual', price: 20, needsPhoto: true, products: ['Individual 8x10'] },
                    'D': { name: 'Package D', desc: '8×10 Class Group (Buddy Shot)', price: 20, needsPhoto: true, products: ['Buddy Shot 8x10'] },
                    'E': { name: 'Package E', desc: '5×7 Class Group', price: 15, needsPhoto: false, products: ['Class Group 5x7'] },
                    'F': { name: 'Package F', desc: '5×7 Individual', price: 15, needsPhoto: true, products: ['Individual 5x7'] },
                    'G1': { name: 'Package G1', desc: 'Mouse Pad', price: 15, needsPhoto: true, products: ['Mouse Pad'] },
                    'G2': { name: 'Package G2', desc: 'Phone Socket Grip', price: 15, needsPhoto: true, products: ['Phone Socket Grip'] },
                    'G3': { name: 'Package G3', desc: 'Dog Tag', price: 15, needsPhoto: true, products: ['Dog Tag'] },
                    'G4': { name: 'Package G4', desc: 'Bag Tag (Single-Sided)', price: 15, needsPhoto: true, products: ['Bag Tag Single'] },
                    'G5': { name: 'Package G5', desc: 'Bag Tag (Double-Sided)', price: 15, needsPhoto: true, products: ['Bag Tag Double'] },
                    'G6': { name: 'Package G6', desc: '11oz Mug (Full Wrap)', price: 15, needsPhoto: true, products: ['Mug 11oz'] },
                    'G7': { name: 'Package G7', desc: '14oz Deluxe Travel Mug', price: 30, needsPhoto: true, products: ['Travel Mug 14oz'] }
                }
            }
        };

        const CONFIG = {
            apiKey: 'af081af2c96a9cbb9b8e122986b113b5',
            taxRate: 0.06
        };

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(() => {
                // Check if already authenticated this session
                return sessionStorage.getItem('pvme_authenticated') === 'true';
            });
            const [passwordInput, setPasswordInput] = useState('');
            const [passwordError, setPasswordError] = useState(false);
            
            const CORRECT_PASSWORD = 'Scout95**';
            
            const handleLogin = () => {
                if (passwordInput === CORRECT_PASSWORD) {
                    setIsAuthenticated(true);
                    sessionStorage.setItem('pvme_authenticated', 'true');
                    setPasswordError(false);
                } else {
                    setPasswordError(true);
                    setPasswordInput('');
                }
            };
            
            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    handleLogin();
                }
            };
            
            const [selectedForm, setSelectedForm] = useState('new_ait');
            const [orders, setOrders] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [view, setView] = useState('shoot');
            const [expandedOrder, setExpandedOrder] = useState(null);
            const [showProductTotals, setShowProductTotals] = useState(false);
            const [showFulfillment, setShowFulfillment] = useState(false);
            const [showReviewModal, setShowReviewModal] = useState(false);
            const [reviewOrder, setReviewOrder] = useState(null);
            const [reviewPhone, setReviewPhone] = useState('');
            const [sendingReview, setSendingReview] = useState(false);
            const [reviewSent, setReviewSent] = useState({});
            
            const ZAPIER_WEBHOOK_URL = 'https://hooks.zapier.com/hooks/catch/18465231/ukukv0k/'; // Zapier webhook for review requests
            const GOOGLE_REVIEW_LINK = 'https://g.page/r/CYsNrNGwzgQIEBM/review';
            
            const [dayFilter, setDayFilter] = useState('all');
            const [platoonFilter, setPlatoonFilter] = useState('all');
            const [statusFilter, setStatusFilter] = useState('all');
            const [paymentFilter, setPaymentFilter] = useState('all');
            const [photoTypeFilter, setPhotoTypeFilter] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            
            const [localData, setLocalData] = useState(() => {
                try {
                    const saved = localStorage.getItem('pvme_tracker_data_v2');
                    return saved ? JSON.parse(saved) : {};
                } catch {
                    return {};
                }
            });

            useEffect(() => {
                try {
                    localStorage.setItem('pvme_tracker_data_v2', JSON.stringify(localData));
                } catch (e) {
                    console.error('Failed to save:', e);
                }
            }, [localData]);

            const parseOrders = (submissions, formKey) => {
                const PACKAGES = FORMS[formKey].packages;
                return submissions.map(sub => {
                    const answers = sub.answers || {};
                    let name = '', platoon = '', drillSergeant = '', pictureDay = '',
                        packages = [], buddyName = '', email = '', phone = '', customRequest = '',
                        orderTotal = 0, graduationDate = '';

                    Object.keys(answers).forEach(key => {
                        const answer = answers[key];
                        const text = answer.text || '';
                        const value = answer.answer || '';

                        if (text.includes('Full Name') || text === 'Name') {
                            // Handle name as string or object (first/last name fields)
                            if (typeof value === 'string') {
                                name = value;
                            } else if (typeof value === 'object' && value !== null) {
                                // Combine first and last name if it's an object
                                const first = value.first || value.firstName || '';
                                const last = value.last || value.lastName || '';
                                name = `${first} ${last}`.trim();
                                if (!name) {
                                    name = Object.values(value).filter(v => typeof v === 'string').join(' ').trim();
                                }
                            }
                        }
                        else if (text.includes('Platoon') || text === 'PLATOON') platoon = value;
                        else if (text.includes('Drill Sergeant') || text === 'DRILL SERGEANT') drillSergeant = value;
                        else if (text.includes('Picture Day') || text.includes('Date your taking pictures')) pictureDay = value;
                        else if (text.includes('packages you want') || text === 'My Products') {
                            // Handle different formats: array, string, or object
                            if (Array.isArray(value)) {
                                packages = value;
                            } else if (typeof value === 'string' && value) {
                                packages = [value];
                            } else if (typeof value === 'object' && value !== null) {
                                // If it's an object, try to extract values
                                packages = Object.values(value).filter(v => typeof v === 'string');
                            } else {
                                packages = [];
                            }
                        }
                        else if (text.includes('Buddy')) buddyName = value;
                        else if (text.includes('Email')) email = value;
                        else if (text.includes('Phone') || text.includes('phone') || text.includes('Mobile') || text.includes('mobile') || text.includes('Cell') || text.includes('cell')) {
                            if (typeof value === 'object' && value.full) {
                                phone = value.full;
                            } else if (typeof value === 'string') {
                                phone = value;
                            }
                        }
                        else if (text.includes('custom request') || text.includes('Additional Comments')) customRequest = value;
                        else if (text.includes('Order Total')) orderTotal = parseFloat(value) || 0;
                        else if (text.includes('Graduate')) graduationDate = value;
                    });

                    let parsedPackages = [];
                    try {
                        parsedPackages = packages.map(pkg => {
                            // Make sure pkg is a string
                            if (typeof pkg !== 'string') return null;
                            // Match "Package A", "Package G1", "A", "G1", etc.
                            const match = pkg.match(/Package\s*([A-Z]\d?)|^([A-Z]\d?)/i);
                            if (match) {
                                const code = (match[1] || match[2]).toUpperCase();
                                if (PACKAGES[code]) {
                                    return { code, raw: pkg, ...PACKAGES[code] };
                                }
                            }
                            return null;
                        }).filter(p => p && p.name);
                    } catch (e) {
                        console.error('Error parsing packages:', e, packages);
                        parsedPackages = [];
                    }

                    const subtotal = parsedPackages.reduce((sum, p) => sum + (p.price || 0), 0);
                    const tax = subtotal * CONFIG.taxRate;
                    const calculatedTotal = subtotal + tax;

                    return {
                        id: sub.id,
                        name,
                        platoon,
                        drillSergeant,
                        pictureDay,
                        packages: parsedPackages,
                        buddyName,
                        email,
                        phone,
                        customRequest,
                        orderTotal: orderTotal || calculatedTotal,
                        subtotal,
                        tax,
                        graduationDate,
                        createdAt: sub.created_at
                    };
                }).filter(o => o.name);
            };

            const loadOrders = async () => {
                setLoading(true);
                setError(null);
                
                const formConfig = FORMS[selectedForm];
                
                try {
                    const response = await fetch(
                        `https://api.jotform.com/form/${formConfig.formId}/submissions?apiKey=${CONFIG.apiKey}&limit=1000&filter=%7B%22status%22%3A%22ACTIVE%22%7D`
                    );
                    const data = await response.json();
                    
                    if (data.responseCode === 200) {
                        const parsed = parseOrders(data.content, selectedForm);
                        setOrders(parsed);
                    } else {
                        setError('Failed to load: ' + (data.message || 'Unknown error'));
                    }
                } catch (err) {
                    setError('Connection error: ' + err.message);
                }
                
                setLoading(false);
            };

            useEffect(() => {
                loadOrders();
            }, [selectedForm]);

            const filteredOrders = orders.filter(order => {
                if (dayFilter !== 'all' && order.pictureDay !== dayFilter) return false;
                if (platoonFilter !== 'all' && order.platoon !== platoonFilter) return false;
                const isCompleted = localData[order.id]?.completed;
                const isPaid = localData[order.id]?.paid;
                if (statusFilter === 'pending' && isCompleted) return false;
                if (statusFilter === 'completed' && !isCompleted) return false;
                if (paymentFilter === 'paid' && !isPaid) return false;
                if (paymentFilter === 'unpaid' && isPaid) return false;
                if (searchQuery && !order.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                
                // Photo type filter
                if (photoTypeFilter !== 'all') {
                    const hasPhotoType = order.packages.some(pkg => {
                        const code = pkg.code;
                        if (photoTypeFilter === 'individual') return ['A', 'C', 'F'].includes(code);
                        if (photoTypeFilter === 'buddy') return code === 'D';
                        if (photoTypeFilter === 'class') return ['A', 'B', 'E'].includes(code);
                        if (photoTypeFilter === 'products') return code.startsWith('G');
                        return false;
                    });
                    if (!hasPhotoType) return false;
                }
                
                return true;
            }).sort((a, b) => {
                const nameA = (a.name || '').toString();
                const nameB = (b.name || '').toString();
                return nameA.localeCompare(nameB);
            });

            const pictureDays = [...new Set(orders.map(o => o.pictureDay).filter(d => d))].sort();
            const platoons = [...new Set(orders.map(o => o.platoon).filter(p => p))].sort();

            const updatePhotoNumber = (orderId, pkgCode, value) => {
                setLocalData(prev => ({
                    ...prev,
                    [orderId]: {
                        ...prev[orderId],
                        photoNumbers: {
                            ...(prev[orderId]?.photoNumbers || {}),
                            [pkgCode]: value
                        }
                    }
                }));
            };

            const toggleComplete = (orderId) => {
                setLocalData(prev => ({
                    ...prev,
                    [orderId]: {
                        ...prev[orderId],
                        completed: !prev[orderId]?.completed
                    }
                }));
            };

            const togglePaid = (orderId) => {
                const wasUnpaid = !localData[orderId]?.paid;
                
                setLocalData(prev => ({
                    ...prev,
                    [orderId]: {
                        ...prev[orderId],
                        paid: !prev[orderId]?.paid
                    }
                }));
                
                // If marking as paid (not unpaid), show review modal
                if (wasUnpaid) {
                    const order = orders.find(o => o.id === orderId);
                    if (order && !reviewSent[orderId]) {
                        setReviewOrder(order);
                        setReviewPhone(order.phone || '');
                        setShowReviewModal(true);
                    }
                }
            };
            
            const sendReviewRequest = async () => {
                if (!reviewPhone || !reviewOrder) return;
                
                setSendingReview(true);
                
                try {
                    await fetch(ZAPIER_WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            phone: reviewPhone,
                            name: reviewOrder.name,
                            reviewLink: GOOGLE_REVIEW_LINK,
                            message: `Thank you for choosing us! Please give us a review: ${GOOGLE_REVIEW_LINK}`
                        })
                    });
                    
                    // Mark as sent
                    setReviewSent(prev => ({
                        ...prev,
                        [reviewOrder.id]: true
                    }));
                    
                    setShowReviewModal(false);
                    setReviewOrder(null);
                    setReviewPhone('');
                    
                    alert('Review request sent!');
                } catch (error) {
                    alert('Failed to send. Please try again.');
                }
                
                setSendingReview(false);
            };
            
            const skipReview = () => {
                setShowReviewModal(false);
                setReviewOrder(null);
                setReviewPhone('');
            };

            const getPhotoNumber = (orderId, pkgCode) => {
                return localData[orderId]?.photoNumbers?.[pkgCode] || '';
            };

            const isCompleted = (orderId) => localData[orderId]?.completed || false;
            const isPaid = (orderId) => localData[orderId]?.paid || false;

            // Calculate product totals
            const getProductTotals = () => {
                const totals = {};
                filteredOrders.forEach(order => {
                    order.packages.forEach(pkg => {
                        if (pkg.products) {
                            pkg.products.forEach(product => {
                                totals[product] = (totals[product] || 0) + 1;
                            });
                        }
                    });
                });
                return totals;
            };

            // Generate fulfillment list by product
            const getFulfillmentData = () => {
                const byProduct = {};
                
                filteredOrders.forEach(order => {
                    order.packages.forEach(pkg => {
                        if (pkg.products) {
                            const photoNum = getPhotoNumber(order.id, pkg.code);
                            pkg.products.forEach(product => {
                                if (!byProduct[product]) {
                                    byProduct[product] = [];
                                }
                                byProduct[product].push({
                                    name: order.name,
                                    photoNumber: photoNum,
                                    packageCode: pkg.code,
                                    buddyName: pkg.code === 'D' ? order.buddyName : null
                                });
                            });
                        }
                    });
                });

                // Sort each product's list by name
                Object.keys(byProduct).forEach(product => {
                    byProduct[product].sort((a, b) => {
                        const nameA = (a.name || '').toString();
                        const nameB = (b.name || '').toString();
                        return nameA.localeCompare(nameB);
                    });
                });

                return byProduct;
            };

            const stats = {
                total: orders.length,
                filtered: filteredOrders.length,
                completed: filteredOrders.filter(o => isCompleted(o.id)).length,
                pending: filteredOrders.filter(o => !isCompleted(o.id)).length,
                revenue: filteredOrders.reduce((sum, o) => sum + o.orderTotal, 0),
                collected: filteredOrders.filter(o => isPaid(o.id)).reduce((sum, o) => sum + o.orderTotal, 0),
                outstanding: filteredOrders.filter(o => !isPaid(o.id)).reduce((sum, o) => sum + o.orderTotal, 0),
                paidCount: filteredOrders.filter(o => isPaid(o.id)).length,
                unpaidCount: filteredOrders.filter(o => !isPaid(o.id)).length
            };

            const exportCSV = () => {
                const rows = filteredOrders.map(o => {
                    const photoNums = Object.entries(localData[o.id]?.photoNumbers || {})
                        .filter(([k, v]) => v)
                        .map(([k, v]) => `${k}:${v}`).join('; ');
                    return [
                        o.name,
                        o.platoon,
                        o.pictureDay,
                        o.packages.map(p => p.code).join(', '),
                        photoNums,
                        o.orderTotal.toFixed(2),
                        isCompleted(o.id) ? 'Yes' : 'No',
                        isPaid(o.id) ? 'Yes' : 'No',
                        o.buddyName,
                        o.email
                    ].map(v => `"${v || ''}"`).join(',');
                });
                
                const csv = ['Name,Platoon,PictureDay,Packages,PhotoNumbers,Total,Completed,Paid,BuddyName,Email', ...rows].join('\n');
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pvme_orders_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const exportFulfillment = () => {
                const fulfillment = getFulfillmentData();
                let csv = 'Product,Name,Photo Number,Buddy Name\n';
                
                Object.keys(fulfillment).sort().forEach(product => {
                    fulfillment[product].forEach(item => {
                        csv += `"${product}","${item.name}","${item.photoNumber || ''}","${item.buddyName || ''}"\n`;
                    });
                });

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pvme_fulfillment_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const clearData = () => {
                if (confirm('Clear all photo numbers, completion, and payment status? This cannot be undone.')) {
                    setLocalData({});
                    localStorage.removeItem('pvme_tracker_data_v2');
                }
            };

            const styles = {
                header: {
                    background: 'linear-gradient(135deg, #ca8a04 0%, #a16207 100%)',
                    color: '#0f172a',
                    padding: '16px',
                    position: 'sticky',
                    top: 0,
                    zIndex: 100
                },
                title: { fontSize: '20px', fontWeight: 'bold', marginBottom: '4px' },
                subtitle: { fontSize: '12px', opacity: 0.8 },
                btnGroup: { display: 'flex', gap: '8px', marginTop: '12px', flexWrap: 'wrap' },
                btn: {
                    background: '#0f172a',
                    color: '#eab308',
                    border: 'none',
                    padding: '10px 14px',
                    borderRadius: '8px',
                    fontSize: '12px',
                    fontWeight: '600',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '6px'
                },
                statsBar: {
                    display: 'flex',
                    gap: '12px',
                    padding: '12px 16px',
                    background: '#1e293b',
                    borderBottom: '1px solid #334155',
                    overflowX: 'auto',
                    flexWrap: 'wrap'
                },
                stat: { textAlign: 'center', minWidth: '55px' },
                statValue: { fontSize: '18px', fontWeight: 'bold', color: '#eab308' },

                                            style={{
                                                flex: 2,
                                                padding: '14px',
                                                background: reviewPhone ? '#eab308' : '#334155',
                                                color: reviewPhone ? '#0f172a' : '#64748b',
                                                border: 'none',
                                                borderRadius: '8px',
                                                fontSize: '14px',
                                                fontWeight: '600',
                                                cursor: reviewPhone ? 'pointer' : 'not-allowed',
                                                opacity: sendingReview ? 0.7 : 1
                                            }}
                                        >
                                            {sendingReview ? '⏳ Sending...' : '📱 Send Review Request'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
